<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>

  <meta
    http-equiv="refresh"
    content="0; url=https://archive.sabrisasuu.workers.dev/"
  >

  <script>
    const target =
      "https://archive.sabrisasuu.workers.dev" +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    window.location.replace(target);
  </script>
</head>

<body>
  <p>
    Redirecting to
    <a href="https://archive.sabrisasuu.workers.dev/">
      my portfolio
    </a>...
  </p>
</body>
</html>
